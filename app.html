<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แพลนเนอร์ · Ultimate ADHD Planner</title>
<link rel="stylesheet" href="planner/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%A0%3C/text%3E%3C/svg%3E">
<style>
/* แถบบัญชี — ใช้โทเคนสีชุดเดียวกับแพลนเนอร์ ไม่ดึง console.css มาชนกัน */
.pbar{position:sticky;top:0;z-index:60;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 20px;font-size:14px}
.pbar a{color:var(--muted);text-decoration:none;padding:6px 11px;border-radius:9px}
.pbar a:hover{background:var(--surface-2);color:var(--text)}
.pbar a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.pbar .sp{flex:1}
.pbar img{width:28px;height:28px;border-radius:50%;object-fit:cover;background:var(--surface-2)}
.pbar .who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.pbar button{background:none;border:1px solid transparent;color:var(--muted);
  border-radius:9px;padding:6px 11px;font:inherit;font-size:13.5px;cursor:pointer}
.pbar button:hover{border-color:var(--border);color:var(--text)}
.pnotice{margin:0;padding:12px 20px;font-size:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pnotice.warn{background:var(--warn-soft);border-bottom:1px solid var(--warn)}
.pnotice.bad{background:var(--danger-soft);border-bottom:1px solid var(--danger)}
.pnotice .sp{flex:1;min-width:100px}
.pnotice a.cta{background:var(--accent);color:#fff;text-decoration:none;border-radius:9px;
  padding:8px 15px;font-weight:600;font-size:13.5px;white-space:nowrap}
.boot{padding:60px 20px;text-align:center;color:var(--muted)}
@media (max-width:860px){
  .pbar{padding:8px 14px;font-size:13.5px}
  .pbar .who span{display:none}
  .pnotice{padding:11px 14px}
}
</style>
</head>
<body>

<div id="bar"></div>
<div id="notice"></div>

<div class="app" id="shell" hidden>
  <nav class="sidebar">
    <div class="brand">
      🧠
      <div>Ultimate ADHD Planner<small id="ownerLabel">กำลังโหลด…</small></div>
    </div>
    <div id="nav"></div>
  </nav>

  <main class="main">
    <div class="topbar">
      <div class="datenav">
        <button class="btn ghost" data-act="date-prev" title="วันก่อนหน้า">◀</button>
        <b id="dateLabel"></b>
        <button class="btn ghost" data-act="date-next" title="วันถัดไป">▶</button>
      </div>
      <button class="btn" data-act="date-today">วันนี้</button>
      <input type="date" id="datePicker" style="width:auto">
      <div class="spacer"></div>
      <div class="sync" id="syncBadge"><i></i> กำลังเชื่อมต่อ…</div>
      <button class="btn" id="themeBtn" data-act="theme" title="สลับธีม">🌗</button>
    </div>
    <div id="panel"></div>
  </main>
</div>

<p class="boot" id="boot">กำลังตรวจสอบสิทธิ์การใช้งาน…</p>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script type="module" src="lib/app-boot.js"></script>
</body>
</html>
